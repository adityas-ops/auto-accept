<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver App Simulator (Rapido / Porter)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #F4F5F7; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* App Top Bar */
    .top-bar {
      background: #FFFFFF;
      padding: 14px 18px 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #EAEAEA;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .order-count {
      font-size: 20px;
      font-weight: 800;
      color: #111;
    }
    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .sound-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #E8EBF0;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #666;
    }
    
    /* Sub Header filters */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #ECECEC;
    }
    .filter-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #F4F5F7;
      border: 1px solid #E2E4E8;
      font-size: 13px;
      font-weight: 600;
      color: #444;
    }

    /* Container */
    .orders-container {
      flex: 1;
      padding: 14px 14px 140px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Card */
    .ride-card {
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      padding: 16px;
      position: relative;
      transition: all 0.25s ease;
    }
    .ride-card.accepted {
      background: #E8F5E9 !important;
      border-color: #2E7D32 !important;
      box-shadow: 0 0 0 3px #2E7D32 !important;
    }

    /* Card Header Badge & Fare */
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #EFF2F7;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #222;
    }
    .fare-text {
      font-size: 32px;
      font-weight: 900;
      color: #111;
      line-height: 1;
    }

    /* Route details */
    .route-flow {
      position: relative;
      padding-left: 26px;
      margin: 14px 0 16px 0;
    }
    .route-line {
      position: absolute;
      left: 7px;
      top: 14px;
      bottom: 24px;
      width: 2px;
      background: #333;
    }
    .stop-row {
      position: relative;
      margin-bottom: 16px;
    }
    .stop-row:last-child {
      margin-bottom: 0;
    }
    .stop-icon {
      position: absolute;
      left: -26px;
      top: 0;
      width: 16px;
      font-size: 14px;
      text-align: center;
      line-height: 1;
      color: #111;
    }
    .stop-km {
      font-size: 17px;
      font-weight: 800;
      color: #111;
      margin-bottom: 2px;
    }
    .stop-address {
      font-size: 13px;
      line-height: 1.35;
      color: #444;
      font-weight: 500;
    }

    /* Action bottom */
    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #F0F0F0;
    }
    .timer-circle {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      border: 3px solid #E0E0E0;
      border-top-color: #F59E0B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #666;
      flex-shrink: 0;
    }
    .accept-btn {
      flex: 1;
      height: 54px;
      background: #FFC400;
      color: #111;
      border: none;
      border-radius: 27px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(255, 196, 0, 0.45);
      transition: background 0.2s, transform 0.1s;
      outline: none;
      user-select: none;
    }
    .accept-btn:active {
      transform: scale(0.98);
      background: #E5B000;
    }
    .accept-btn.clicked {
      background: #2E7D32 !important;
      color: #FFF !important;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.5) !important;
    }

    /* Slider track */
    .slider-track {
      position: relative;
      flex: 1;
      height: 54px;
      border-radius: 27px;
      background: #0066FF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 17px;
      font-weight: 700;
      overflow: hidden;
      cursor: pointer;
    }
    .slider-knob {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 46px;
      height: 46px;
      border-radius: 23px;
      background: #FFF;
      color: #0066FF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Fixed Controls at Bottom for Testing */
    .test-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1A1D24;
      color: #FFF;
      padding: 10px 14px 14px 14px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
      border-top: 1px solid #333;
      z-index: 100;
    }
    .controls-title {
      font-size: 12px;
      color: #8A8F9A;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .ctl-btn {
      flex: 1;
      white-space: nowrap;
      background: #2A2E37;
      color: #FFF;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 9px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .ctl-btn.primary {
      background: #FFC400;
      color: #000;
      border-color: #FFC400;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="order-count" id="headerCount">1 Order</div>
    <div class="top-actions">
      <div class="sound-badge">
        <span>🔇</span> OFF
      </div>
    </div>
  </div>

  <!-- Sub Header Filters (Go To / Stay In) -->
  <div class="filter-bar">
    <div class="filter-pill">📍 Go To</div>
    <div class="filter-pill">⏳ Stay In</div>
  </div>

  <!-- Orders Container -->
  <div class="orders-container" id="ordersList">
    <!-- Default Card 1: Porter / Rapido Auto (₹51) -->
    <div class="ride-card" id="card-1">
      <div class="card-head">
        <div class="type-badge">🛺 Auto</div>
        <div class="fare-text">₹51</div>
      </div>
      <div class="route-flow">
        <div class="route-line"></div>
        <div class="stop-row">
          <div class="stop-icon">•</div>
          <div class="stop-km">• 1.0 Km</div>
          <div class="stop-address">Ashiyana - Phoenix United Mall, Lucknow, U.P., Kanpur Road, Sector B, Bargawan, Alambagh</div>
        </div>
        <div class="stop-row">
          <div class="stop-icon">▼</div>
          <div class="stop-km">▼ 3.4 Km</div>
          <div class="stop-address">Krishna nagar - Hari Om Nagar, Manas Nagar, Lucknow, Uttar Pradesh, India</div>
        </div>
      </div>
      <div class="action-row">
        <div class="timer-circle" id="countdown">15s</div>
        <button type="button" class="accept-btn" id="acceptBtn" aria-label="Accept" role="button" title="Accept" onclick="handleAccept(this, 'card-1')">
          <span class="btn-text">Accept</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Test Controller for Drivers -->
  <div class="test-controls">
    <div class="controls-title">
      <span>RideAssist Simulator</span>
      <span id="acceptStatus" style="color: #FFC400;">Ready</span>
    </div>
    <div class="btn-group">
      <button class="ctl-btn primary" onclick="loadPorterAuto()">Auto (₹51)</button>
      <button class="ctl-btn" onclick="loadRapidoCountdown()">Accept in 7s (₹127)</button>
      <button class="ctl-btn" onclick="loadRapidoBike()">Bike (₹35)</button>
      <button class="ctl-btn" onclick="loadSliderCard()">Swipe Slider (₹91)</button>
    </div>
  </div>

  <script>
    let timerVal = 15;
    setInterval(() => {
      timerVal = timerVal > 1 ? timerVal - 1 : 15;
      const t = document.getElementById('countdown');
      if (t) t.textContent = timerVal + 's';
      const c7 = document.getElementById('countdownBtn');
      if (c7) c7.textContent = `Accept in ${Math.min(timerVal, 7)}s`;
    }, 1000);

    let audioCtx = null;
    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    function handleAccept(btn, cardId) {
      if (btn.classList.contains('clicked')) return;
      btn.classList.add('clicked');
      btn.innerHTML = '<span>✓ Accepted by RideAssist!</span>';
      btn.setAttribute('aria-label', 'Accepted');
      const card = document.getElementById(cardId);
      if (card) card.classList.add('accepted');

      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      playBeep();

      const st = document.getElementById('acceptStatus');
      const timeStr = new Date().toLocaleTimeString();
      st.textContent = `✓ Auto-Accepted at ${timeStr}!`;
      st.style.color = '#4CAF50';
    }

    function loadPorterAuto() {
      document.getElementById('headerCount').textContent = '1 Order';
      document.getElementById('ordersList').innerHTML = `
        <div class="ride-card" id="card-1">
          <div class="card-head">
            <div class="type-badge">🛺 Auto</div>
            <div class="fare-text">₹51</div>
          </div>
          <div class="route-flow">
            <div class="route-line"></div>
            <div class="stop-row">
              <div class="stop-icon">•</div>
              <div class="stop-km">• 1.0 Km</div>
              <div class="stop-address">Ashiyana - Phoenix United Mall, Lucknow, U.P., Kanpur Road, Sector B, Bargawan, Alambagh</div>
            </div>
            <div class="stop-row">
              <div class="stop-icon">▼</div>
              <div class="stop-km">▼ 3.4 Km</div>
              <div class="stop-address">Krishna nagar - Hari Om Nagar, Manas Nagar, Lucknow, Uttar Pradesh, India</div>
            </div>
          </div>
          <div class="action-row">
            <div class="timer-circle" id="countdown">15s</div>
            <button type="button" class="accept-btn" id="acceptBtn" aria-label="Accept" role="button" title="Accept" onclick="handleAccept(this, 'card-1')">
              <span class="btn-text">Accept</span>
            </button>
          </div>
        </div>
      `;
      document.getElementById('acceptStatus').textContent = 'Ready';
      document.getElementById('acceptStatus').style.color = '#FFC400';
    }

    function loadRapidoCountdown() {
      document.getElementById('headerCount').textContent = '1 Order';
      document.getElementById('ordersList').innerHTML = `
        <div class="ride-card" id="card-2">
          <div class="card-head">
            <div class="type-badge">🛺 Auto</div>
            <div class="fare-text">₹127</div>
          </div>
          <div class="route-flow">
            <div class="route-line"></div>
            <div class="stop-row">
              <div class="stop-icon">•</div>
              <div class="stop-km">• 0.3 Km</div>
              <div class="stop-address">LDA Colony (0.3 km), B1/61, Sector G, LDA Colony, Lucknow, UP</div>
            </div>
            <div class="stop-row">
              <div class="stop-icon">▼</div>
              <div class="stop-km">▼ 3.0 Km</div>
              <div class="stop-address">Alambagh (3.0 km), 551/224, Ram Nagar, Alambagh, Lucknow, UP</div>
            </div>
          </div>
          <div class="action-row">
            <button type="button" class="accept-btn" id="countdownBtn" style="background:#0066FF; color:#FFF; font-size:18px;" aria-label="Accept in 7s" role="button" title="Accept in 7s" onclick="handleAccept(this, 'card-2')">
              Accept in 7s
            </button>
          </div>
        </div>
      `;
      document.getElementById('acceptStatus').textContent = 'Ready';
      document.getElementById('acceptStatus').style.color = '#FFC400';
    }

    function loadRapidoBike() {
      document.getElementById('headerCount').textContent = '1 Order';
      document.getElementById('ordersList').innerHTML = `
        <div class="ride-card" id="card-3">
          <div class="card-head">
            <div class="type-badge">🛵 Bike</div>
            <div class="fare-text">₹35</div>
          </div>
          <div class="route-flow">
            <div class="route-line"></div>
            <div class="stop-row">
              <div class="stop-icon">•</div>
              <div class="stop-km">• 1.2 Km</div>
              <div class="stop-address">Sector 72 Noida - Best home 3, Sarfabad Village, Noida</div>
            </div>
            <div class="stop-row">
              <div class="stop-icon">▼</div>
              <div class="stop-km">▼ 5.0 Km</div>
              <div class="stop-address">Sector 67 Noida - Home Blend Coffee Roasters, Block A, Noida</div>
            </div>
          </div>
          <div class="action-row">
            <div class="timer-circle" id="countdown">15s</div>
            <button type="button" class="accept-btn" id="acceptBtn" aria-label="Accept" role="button" title="Accept" onclick="handleAccept(this, 'card-3')">
              <span class="btn-text">Accept</span>
            </button>
          </div>
        </div>
      `;
      document.getElementById('acceptStatus').textContent = 'Ready';
      document.getElementById('acceptStatus').style.color = '#FFC400';
    }

    function loadSliderCard() {
      document.getElementById('headerCount').textContent = '1 Order';
      document.getElementById('ordersList').innerHTML = `
        <div class="ride-card" id="card-4">
          <div class="card-head">
            <div class="type-badge">🛺 Auto</div>
            <div class="fare-text">₹91</div>
          </div>
          <div class="route-flow">
            <div class="route-line"></div>
            <div class="stop-row">
              <div class="stop-icon">•</div>
              <div class="stop-km">• 1.1 Km</div>
              <div class="stop-address">Ashiyana - 569/153/GHA, near UCO Bank, Sector C, Lucknow</div>
            </div>
            <div class="stop-row">
              <div class="stop-icon">▼</div>
              <div class="stop-km">▼ 8.8 Km</div>
              <div class="stop-address">New Para Colony - Hardoi Devpur, Rajajipuram, Lucknow</div>
            </div>
          </div>
          <div class="action-row">
            <div class="slider-track" id="sliderAccept" role="button" aria-label="Swipe to accept" onclick="handleAccept(this, 'card-4')">
              <div class="slider-knob">›</div>
              <span>Swipe to accept</span>
            </div>
          </div>
        </div>
      `;
      document.getElementById('acceptStatus').textContent = 'Ready';
      document.getElementById('acceptStatus').style.color = '#FFC400';
    }
  </script>
</body>
</html>
